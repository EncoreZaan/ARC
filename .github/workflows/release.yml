name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.1.1)'
        required: true
        default: 'v2.1.1'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'mcp-server/package-lock.json'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies & Bundle MCP Server
        run: |
          cd mcp-server
          npm ci
          npm run build
          npm run bundle

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Create Release Tag if manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RELEASE_TAG=${{ github.event.inputs.version }}" >> $env:GITHUB_ENV

      - name: Set Release Tag if pushed
        if: github.event_name == 'push'
        run: |
          echo "RELEASE_TAG=${{ github.ref_name }}" >> $env:GITHUB_ENV

      - name: Publish Release (with pre-built binary if available)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Revit AI Bridge ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: true
