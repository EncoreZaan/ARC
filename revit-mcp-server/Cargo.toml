[package]
name = "revit-mcp-server"
version = "3.3.0"
edition = "2021"
authors = ["EncoreZaan"]
description = "ARC (Architecture & Revit Copilot) - Native standalone Rust MCP server for Autodesk Revit & BIMcraft"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "io-util", "io-std", "net", "sync", "time", "macros", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
rayon = "1.10"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
